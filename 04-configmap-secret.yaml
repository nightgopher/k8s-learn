# ========== 04 ConfigMap / Secret ==========
# ConfigMap：非敏感配置（明文）
# Secret：敏感配置（base64 编码，只是混淆不是加密；配合 RBAC/外部 KMS 才安全）
# 学习点：
#   1. 从 ConfigMap/Secret 注入环境变量的三种方式
#   2. 热更新：ConfigMap 改了，Pod 里的环境变量不会自动变（需要重启 Pod）；
#      但挂载成文件（volumeMount）的内容可以自动更新
#   3. 演练：改 ConfigMap 里的 MESSAGE → 挂载文件方式可即时看到变化
#
# 用法：
#   kubectl apply -f 04-configmap-secret.yaml
#   kubectl get cm,secret
#   kubectl describe cm demo-config
#   kubectl get secret demo-secret -o yaml        # 看到 base64
#   echo 'aGVsbG8=' | base64 -d                   # 解码验证
#   kubectl create cm/secret --from-file=... --from-literal=...   # 命令行创建
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
data:
  MESSAGE: "Hello from ConfigMap"
  app.properties: |
    mode=dev
    log.level=info

---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
type: Opaque
stringData:            # 写明文，K8s 自动转 base64
  DB_PASSWORD: "s3cr3t-p@ss"
  API_KEY: "abc-12345"

---
# 演示 Pod：用上面 CM/Secret 注入环境变量 + 挂载文件
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: demo
      image: demo:v1
      imagePullPolicy: IfNotPresent
      env:
        - name: MESSAGE          # 方式1：从 ConfigMap 注入单键
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: MESSAGE
        - name: DB_PASSWORD      # 方式2：从 Secret 注入单键
          valueFrom:
            secretKeyRef:
              name: demo-secret
              key: DB_PASSWORD
        - name: APP_VERSION
          value: "v1"
      volumeMounts:
        - name: props            # 方式3：整块挂载成文件（可热更新）
          mountPath: /etc/demo
          readOnly: true
  volumes:
    - name: props
      configMap:
        name: demo-config
