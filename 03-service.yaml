# ========== 03 Service ==========
# Service 是 Pod 的稳定访问入口（Pod IP 会变，Service 不会）
# 三种类型：
#   ClusterIP：集群内访问（默认）
#   NodePort：每台节点开一个端口对外
#   LoadBalancer：云环境自动分配外部 IP（OrbStack 下映射到 localhost）
# 学习点：
#   1. selector 用 label 选择后端 Pod（与 Deployment 的 labels 对应）
#   2. ClusterIP 下的 DNS：<service>.<namespace>.svc.cluster.local
#   3. 同一 Service 下多个 Pod 自动负载均衡（round-robin）
#
# 用法：
#   kubectl apply -f 03-service.yaml
#   kubectl get svc
#   # 集群内测试 DNS（临时起个 Pod）：
#   kubectl run curl-test --image=curlimages/curl -it --rm -- sh
#   curl http://demo:8080          # 在容器内通过 Service 名访问
apiVersion: v1
kind: Service
metadata:
  name: demo
spec:
  type: ClusterIP
  selector:
    app: demo
  ports:
    - port: 8080          # Service 对外端口
      targetPort: 8080    # 容器端口

---
# NodePort 版（在节点上开一个 30000-32767 之间的端口，OrbStack 下可直接 localhost 访问）
apiVersion: v1
kind: Service
metadata:
  name: demo-nodeport
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080     # 固定节点端口，访问 http://localhost:30080
