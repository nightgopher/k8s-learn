# ========== 06 Job / CronJob ==========
# Job：一次性任务（跑完就结束）
# CronJob：定时任务（按 cron 表达式周期创建 Job）
# 学习点：
#   1. backoffLimit：失败重试次数
#   2. restartPolicy=OnFailure（Job 里容器必须是 OnFailure/Never，不能 Always）
#   3. CronJob 里 schedule 是标准 cron 5 段式：分 时 日 月 周
#   4. 查看结果：kubectl logs job/xxx
#
# 用法：
#   kubectl apply -f 06-job-cronjob.yaml
#   kubectl get jobs,po
#   kubectl logs job/hello-job        # 看输出
#   kubectl get cronjob
#   演示后删除：kubectl delete -f 06-job-cronjob.yaml

# 一次性任务：跑一条命令然后退出
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hello
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Hello from Job, current time:' && date"]

---
# 定时任务：每分钟执行一次
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
spec:
  schedule: "*/1 * * * *"        # 每分钟
  concurrencyPolicy: Forbid      # 上次没跑完就不允许新起
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: hello
              image: busybox:1.36
              command: ["sh", "-c", "echo 'tick' && date"]
